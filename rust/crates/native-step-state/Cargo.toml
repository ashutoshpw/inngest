[package]
name = "native-step-state"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# A fresh-process integration artifact, never part of the shipped CLI.
test-helper = []

[dependencies]
redis = { version = "=1.8.0", default-features = false, features = ["script"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
xxhash-rust = { version = "=0.8.15", features = ["xxh64"] }

[[bin]]
name = "native-step-test-helper"
path = "src/helper.rs"
required-features = ["test-helper"]
