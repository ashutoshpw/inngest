[package]
name = "opcode-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "opcode-worker"
path = "src/bin/opcode-worker.rs"

[dependencies]
opcode-kernel = { path = "../opcode-kernel" }

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
